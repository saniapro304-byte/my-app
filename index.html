#dlg.on{display:flex}
#dlgBox{background:linear-gradient(160deg,rgba(6,16,12,.98),rgba(4,10,8,.98));border:2px solid #3fd18a;border-radius:10px;padding:12px 14px;max-width:600px;width:100%;box-shadow:0 0 40px rgba(63,209,138,.25)}
#dlgHead{display:flex;align-items:center;gap:10px;margin-bottom:6px}
#dlgAv{width:36px;height:36px;border-radius:6px;background:rgba(63,209,138,.15);border:1px solid #3fd18a;display:flex;align-items:center;justify-content:center;font-size:18px}
#dlgName{color:#5f9;font-size:12px;letter-spacing:2px}
#dlgRole{font-size:9px;color:#7ab;letter-spacing:1px}
#dlgTxt{font-size:11.5px;color:#dfffe9;line-height:1.5;margin-bottom:8px;min-height:36px}
#dlgChoices{display:flex;flex-direction:column;gap:3px}
.dlgC{background:rgba(13,42,28,.7);border:1px solid #1d5;color:#9fecbf;font-family:inherit;font-size:11px;text-align:left;padding:7px 10px;cursor:pointer;border-radius:4px;letter-spacing:1px}
.dlgC:hover{background:#1d5;color:#021}
#camUI{position:fixed;inset:0;z-index:40;display:none;pointer-events:none}
#camUI.on{display:block}
#camOverlay{position:absolute;inset:0;background:repeating-linear-gradient(0deg,rgba(0,0,0,0) 0px,rgba(0,0,0,0) 2px,rgba(0,0,0,.15) 3px,rgba(0,0,0,.15) 4px);po
